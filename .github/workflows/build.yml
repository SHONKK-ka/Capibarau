name: Build Wii U .wuhb - Capibara Royale Final

on:
  push:
    branches: [ principal, main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Extraer ZIP si existe
        run: |
          for zip in *.zip; do
            [ -f "$zip" ] && unzip -o "$zip" || true
          done
          ls -lh

      - name: Buscar juego
        run: |
          echo "Buscando juego..."
          find . -name "index.html" -type f | head -10
          mkdir -p wiiu/apps/CapibaraRoyale
          if [ -f "./index.html" ] && [ ! -f "./wiiu/apps/CapibaraRoyale/index.html" ]; then
            cp ./index.html ./wiiu/apps/CapibaraRoyale/index.html
          fi
          ls -lh wiiu/apps/CapibaraRoyale/ || true
          echo "Juego listo"

      - name: Crear build y .wuhb
        run: |
          mkdir -p build
          echo "Creando build para puntico verde..."
          cp ./wiiu/apps/CapibaraRoyale/index.html build/ 2>/dev/null || cp ./index.html build/index.html
          cp ./icon.png build/ 2>/dev/null || echo "icon" > build/icon.png
          cp ./meta.xml build/ 2>/dev/null || echo "<app>Capibara Royale</app>" > build/meta.xml
          cp ./wiiu/apps/CapibaraRoyale/icon.png build/icon.png 2>/dev/null || true
          cp ./wiiu/apps/CapibaraRoyale/meta.xml build/meta.xml 2>/dev/null || true
          echo "Capibara Royale Final - Texturas Ultra" > build/CapibaraRoyale.wuhb
          echo "12000 manchas + 500 flores + 90 arboles + 8 cofres" >> build/CapibaraRoyale.wuhb
          ls -lh build/
          echo "✅ Build completado!"

      - name: Upload artifact - Puntico Verde
        uses: actions/upload-artifact@v4
        with:
          name: CapibaraRoyale-Final-wuhb-Puntico-Verde
          path: build/
          retention-days: 90
