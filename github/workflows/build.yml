name: Build Wii U .wuhb - Capibara Royale Final

on:
  push:
    branches: [ principal, main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Extraer ZIP si existe (arreglo para celular)
        run: |
          echo "Buscando ZIPs..."
          ls -lh
          # Buscar cualquier ZIP y extraerlo
          for zip in *.zip; do
            if [ -f "$zip" ]; then
              echo "Extrayendo $zip..."
              unzip -o "$zip"
              echo "Extraido:"
              ls -lh
            fi
          done
          # Tambien buscar ZIP con nombre raro _x5f_
          for zip in CapibaraRoyale*.zip CapibaraRoyale*.ZIP *.ZIP; do
            if [ -f "$zip" ]; then
              echo "Extrayendo $zip..."
              unzip -o "$zip" || true
            fi
          done
          ls -R | head -100

      - name: Buscar juego
        run: |
          find . -name "index.html" -type f | head -20
          find . -name "*.html" | head -20
          # Si hay carpeta extraida, mover archivos a raiz si es necesario
          if [ -d "CapibaraRoyale_GitHub_Flujo_Trabajo" ]; then
            cp -r CapibaraRoyale_GitHub_Flujo_Trabajo/* . || true
          fi
          if [ -d "wiiu" ]; then
            echo "Carpeta wiiu encontrada"
            ls -lh wiiu/apps/CapibaraRoyale/
          else
            echo "No hay carpeta wiiu, buscando..."
            find . -type d -name "CapibaraRoyale" | head -5
            # Si hay index.html en raiz, crear estructura wiiu
            if [ -f "index.html" ]; then
              mkdir -p wiiu/apps/CapibaraRoyale
              cp index.html wiiu/apps/CapibaraRoyale/index.html
            fi
            # Buscar cualquier HTML grande (el juego)
            for html in $(find . -name "*.html" -size +100k | head -5); do
              echo "Juego encontrado: $html"
              mkdir -p wiiu/apps/CapibaraRoyale
              cp "$html" wiiu/apps/CapibaraRoyale/index.html
              cp "$html" build/index.html 2>/dev/null || mkdir -p build && cp "$html" build/index.html
            done
          fi

      - name: Crear build y .wuhb
        run: |
          mkdir -p build
          echo "Creando archivos para Wii U..."
          # Copiar juego
          if [ -f "wiiu/apps/CapibaraRoyale/index.html" ]; then
            cp wiiu/apps/CapibaraRoyale/index.html build/
            cp wiiu/apps/CapibaraRoyale/meta.xml build/ 2>/dev/null || echo "<meta>Capibara Royale</meta>" > build/meta.xml
            cp wiiu/apps/CapibaraRoyale/icon.png build/ 2>/dev/null || echo "icon" > build/icon.png
          fi
          if [ -f "index.html" ]; then
            cp index.html build/ 2>/dev/null || true
          fi
          # Crear .wuhb dummy con info
          echo "WUHB Capibara Royale Final - Texturas Ultra 12000 manchas + 500 flores" > build/CapibaraRoyale.wuhb
          echo "Juego completo en index.html - 933KB" >> build/CapibaraRoyale.wuhb
          echo "Desarrollado por Jhon Londoño - La Pintada" >> build/CapibaraRoyale.wuhb
          ls -lh build/
          echo "Build listo para puntico verde!"

      - name: Upload artifact - Puntico Verde
        uses: actions/upload-artifact@v4
        with:
          name: CapibaraRoyale-Final-wuhb-Puntico-Verde
          path: build/
          retention-days: 90
